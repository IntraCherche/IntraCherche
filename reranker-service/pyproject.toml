[project]
name = "reranker-service"
version = "0.1.0"
description = "Cross-encoder reranking service for RAG (bge-reranker-v2-m3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.14.1",
]

# This service runs inference on CPU. Pull torch from PyTorch's CPU-only index
# so the resolver picks torch…+cpu (~180 MB) instead of the default CUDA build,
# which drags in ~2.5 GB of nvidia_* + triton wheels we never use.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
